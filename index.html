<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crypto Watch — реальное время</title>

    <!-- Шрифты -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />

    <!-- Иконки криптовалют -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/simple-icons-font@v16/font/simple-icons.min.css" type="text/css" />

    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="brand">
                <div class="logo"><img src="77.png" alt="Logo" /></div>
                <div>
                    <h1>SSSAVAGEMODEE</h1>
                    <p class="subtitle">Цены в реальном времени</p>
                </div>
            </div>

            <div class="header-actions">
                <button id="portfolioBtn" class="btn" title="Портфель">
                    💼 Портфель
                </button>
                <button id="themeBtn" class="btn btn-icon" title="Сменить тему">
                    🌙
                </button>
                <div class="status">
                    <span class="dot" id="statusDot"></span>
                    <span id="statusText">Подключение…</span>
                </div>
            </div>
        </header>

        <main class="grid" id="grid"></main>

        <!-- ★ Актив REDO -->
        <section class="featured-asset" id="featuredAsset">
            <div class="featured-icon">
                <img src="redo.png" alt="REDO">
            </div>
            <div class="featured-name">REDO</div>
            <div class="featured-price">777 GRAM</div>
            <div class="featured-usd" id="featuredUsd">≈ $0.00</div>
            <div class="featured-volume">Объём: $7.7B</div>
        </section>

        <footer class="footer">
            <span>Источник: Binance WebSocket</span>
            <span id="lastUpdate">—</span>
        </footer>
    </div>

    <!-- ★ Модальное окно с графиком -->
    <div class="modal" id="chartModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">
                    <span id="chartName">Bitcoin</span>
                    <span id="chartTicker" class="modal-ticker">BTC / USDT</span>
                </div>
                <button class="modal-close" id="chartClose">✕</button>
            </div>

            <div class="chart-tabs">
                <button class="tab" data-interval="15m">15 минут</button>
                <button class="tab active" data-interval="1h">1 час</button>
                <button class="tab" data-interval="4h">4 часа</button>
                <button class="tab" data-interval="1d">1 день</button>
            </div>

            <div id="chartContainer" class="chart-container"></div>
        </div>
    </div>

    <!-- ★ Модальное окно портфеля -->
    <div class="modal" id="portfolioModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">
                    <span>Портфель</span>
                </div>
                <button class="modal-close" id="portfolioClose">✕</button>
            </div>
            <div class="portfolio-body">
                <div id="portfolioList" class="portfolio-list"></div>
                <div class="portfolio-total">
                    <div class="total-row">
                        <span class="total-label">Общая стоимость</span>
                        <span class="total-value" id="portfolioTotal">$0.00</span>
                    </div>
                </div>
                <p class="portfolio-hint">
                    Введи количество монет — данные сохранятся автоматически.
                </p>
            </div>
        </div>
    </div>

    <template id="cardTemplate">
        <div class="card">
            <div class="card-head">
                <div class="coin">
                    <div class="coin-icon"></div>
                    <div>
                        <div class="coin-name"></div>
                        <div class="coin-symbol"></div>
                    </div>
                </div>
                <div class="change-badge"></div>
            </div>

            <div class="price"></div>

            <div class="stats">
                <div class="stat">
                    <span class="stat-label">24ч макс</span>
                    <span class="stat-value high">—</span>
                </div>
                <div class="stat">
                    <span class="stat-label">24ч мин</span>
                    <span class="stat-value low">—</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Объём</span>
                    <span class="stat-value volume">—</span>
                </div>
            </div>

            <div class="sparkline">
                <svg viewBox="0 0 100 30" preserveAspectRatio="none">
                    <polyline class="spark-line" fill="none" />
                </svg>
            </div>
        </div>
    </template>

    <!-- ★ TradingView Lightweight Charts -->
    <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
    <script src="app.js"></script>
</body>
</html>
